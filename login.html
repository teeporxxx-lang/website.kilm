<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ | ร้านก๋วยเตี๋ยว</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff4e8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 30px 25px;
    border-radius: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;
    margin: auto;
    background: #ff7a00;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
}

h1 {
    color: #f36c00;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: #ff7200;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #e85f00;
}

#error {
    color: red;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🍜</div>

    <h1>ร้านก๋วยเตี๋ยว</h1>

    <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน">

    <input type="password" id="password" placeholder="รหัสผ่าน">

    <button onclick="login()">เข้าสู่ระบบ</button>

    <div id="error"></div>

</div>

<script>
function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // บัญชีตัวอย่าง
    if (username === "user" && password === "1234") {

        localStorage.setItem("login", "true");
        localStorage.setItem("username", username);

        window.location.href = "menu.html";

    } else {

        document.getElementById("error").innerText =
            "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";

    }
}
</script>

</body>
</html>
