<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ผู้ใช้งาน</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #fff7ef;
    padding-bottom: 90px;
}

.header {
    background: #ff7200;
    color: white;
    padding: 22px;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.profile {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.avatar {
    width: 90px;
    height: 90px;
    margin: auto;
    background: #ff7200;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
}

.logout {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #ff7200;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: white;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    box-shadow: 0 -3px 15px rgba(0,0,0,.15);
}

.bottom-nav a {
    text-align: center;
    text-decoration: none;
    color: #666;
    padding-top: 9px;
    font-size: 12px;
}

.bottom-nav span {
    display: block;
    font-size: 23px;
}

.active {
    color: #ff7200 !important;
}

</style>

</head>

<body>

<div class="header">
    <h2>👤 ผู้ใช้งาน</h2>
</div>


<div class="container">

<div class="profile">

<div class="avatar">
    👤
</div>

<h2 id="username">ผู้ใช้งาน</h2>

<p>สมาชิกเว็บไซต์ร้านก๋วยเตี๋ยว</p>

<button class="logout" onclick="logout()">
ออกจากระบบ
</button>

</div>

</div>


<div class="bottom-nav">

<a href="menu.html">
<span>🍜</span>
เมนูทั้งหมด
</a>

<a href="cart.html">
<span>🛒</span>
ตะกร้า
</a>

<a href="orders.html">
<span>📋</span>
รายการสั่ง
</a>

<a href="profile.html" class="active">
<span>👤</span>
ผู้ใช้งาน
</a>

</div>


<script>

let username =
localStorage.getItem("username") || "ผู้ใช้งาน";

document.getElementById("username").innerText = username;


function logout() {

    localStorage.removeItem("login");
    localStorage.removeItem("username");

    window.location.href = "login.html";

}

</script>

</body>
</html>
